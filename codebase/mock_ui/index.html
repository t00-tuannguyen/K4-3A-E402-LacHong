<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trợ lý Discord LacHong — Mock UI</title>
  <style>
    :root { color-scheme: dark; --bg:#11131a; --panel:#1b1e27; --panel-2:#222633; --line:#323747; --text:#f1f3f7; --muted:#a9b0c1; --blue:#7088ff; --green:#48c78e; --amber:#f2b84b; --red:#ec6d78; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 0,#252a3d 0,#11131a 56%); color:var(--text); font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .app { width:min(1120px,100vw); min-height:680px; display:grid; grid-template-columns:220px minmax(0,1fr) 270px; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:var(--panel); box-shadow:0 24px 70px #0008; }
    aside { padding:18px 14px; background:#171923; border-right:1px solid var(--line); }
    .brand { display:flex; gap:10px; align-items:center; margin:0 6px 28px; font-weight:750; }
    .mark { width:31px; height:31px; display:grid; place-items:center; border-radius:10px; background:var(--blue); font-size:13px; }
    .channel-title { margin:0 7px 8px; color:#777f93; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
    .channel { padding:8px 9px; margin:2px 0; border-radius:7px; color:var(--muted); }
    .channel.active { background:#303647; color:#fff; font-weight:650; }
    main { display:flex; min-width:0; flex-direction:column; }
    header { min-height:64px; padding:0 22px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); }
    header strong { font-size:17px; } header span { color:var(--muted); font-size:13px; }
    .live { margin-left:auto; display:flex; align-items:center; gap:7px; color:#a9dfc5; font-size:12px; }
    .live i { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); }
    #chat { flex:1; overflow:auto; padding:24px clamp(18px,4vw,42px); }
    .message { display:flex; gap:12px; margin:0 0 20px; } .avatar { width:36px; height:36px; flex:none; display:grid; place-items:center; border-radius:50%; background:#3c8d6a; font-size:12px; font-weight:700; }
    .bot .avatar { background:var(--blue); } .head { display:flex; align-items:baseline; gap:8px; } .name { font-weight:700; } .time { color:#7c8496; font-size:12px; }
    .bubble { max-width:680px; } .content { margin-top:3px; white-space:pre-wrap; }
    .source, .notice { margin-top:10px; padding:11px 13px; border-left:3px solid var(--green); border-radius:0 8px 8px 0; background:#17281f; color:#d7eee0; font-size:13px; }
    .notice { border-color:var(--amber); background:#2d2718; color:#f6e5bb; }
    .source a { color:#b7c5ff; } .source small { display:block; margin-top:4px; color:#a2c3ad; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; }
    button { border:0; border-radius:7px; padding:8px 11px; cursor:pointer; background:#343a4c; color:#fff; font:inherit; font-size:13px; } button:hover { filter:brightness(1.12); } button.handoff { background:#8e3a45; } button.ticket { background:#73591e; }
    .typing { display:none; color:var(--muted); padding:0 42px 12px; font-size:13px; } .typing.show { display:block; }
    form { display:flex; gap:10px; padding:16px 20px 20px; border-top:1px solid var(--line); } textarea { flex:1; min-height:47px; max-height:140px; resize:vertical; border:1px solid #41485d; border-radius:9px; padding:12px; outline:none; background:#262a36; color:var(--text); font:inherit; } textarea:focus { border-color:var(--blue); } form button { min-width:68px; background:var(--blue); font-weight:700; }
    .quick { padding:18px 14px; background:#171923; border-left:1px solid var(--line); } .quick h2 { margin:0 0 5px; font-size:14px; } .quick p { margin:0 0 13px; color:var(--muted); font-size:12px; } .quick button { width:100%; margin:0 0 8px; text-align:left; background:#272b38; }
    .toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,120px); padding:11px 15px; border:1px solid #4a7e62; border-radius:9px; background:#183124; color:#dbf4e5; transition:.22s; box-shadow:0 10px 26px #0008; } .toast.show { transform:translate(-50%,0); }
    .error { border-color:var(--red); background:#351f25; color:#ffd7dc; }
    @media (max-width:840px) { .app { grid-template-columns:1fr; min-height:100vh; border-radius:0; } aside,.quick { display:none; } }
  </style>
</head>
<body>
  <section class="app">
    <aside>
      <div class="brand"><div class="mark">TL</div><span>LacHong K4</span></div>
      <p class="channel-title">Kênh văn bản</p>
      <div class="channel"># thong-bao-chung</div><div class="channel active"># hoi-dap-lab</div><div class="channel"># ticket-support</div><div class="channel"># chung-3a</div>
    </aside>
    <main>
      <header><strong># hoi-dap-lab</strong><span>Tra cứu theo thông báo chính thức</span><div class="live"><i></i> API Python</div></header>
      <div id="chat" aria-live="polite"></div>
      <div id="typing" class="typing">Trợ lý K4 đang đối chiếu nguồn chính thức…</div>
      <form id="composer"><textarea id="message" placeholder="Hỏi hạn nộp, cách nộp bài hoặc thủ tục K4…" required></textarea><button>Gửi</button></form>
    </main>
    <section class="quick"><h2>Test nhanh</h2><p>Các case của Golden Set</p><button data-q="Hạn nộp Lab 2 CVAT là khi nào?">Hạn nộp Lab 2 CVAT</button><button data-q="Hạn nộp bài là mấy giờ vậy ạ?">Câu hỏi mơ hồ</button><button data-q="Hạn nộp Lab 4 là ngày nào?">Lab 4 chưa công bố</button><button data-q="Check xem t đã nộp bài codelab chưa">Ngoài thẩm quyền</button><button data-q="Email báo 23h59 nhưng Discord ghi 18h00, theo giờ nào?">Mâu thuẫn nguồn</button></section>
  </section>
  <div id="toast" class="toast"></div>
  <script>
    const API_URL = 'http://127.0.0.1:8000/api/assist';
    const chat = document.querySelector('#chat'), typing = document.querySelector('#typing'), input = document.querySelector('#message'), toast = document.querySelector('#toast');
    const time = () => new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
    const escape = (text) => String(text ?? '');
    function toastMessage(text) { toast.textContent = text; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2800); }
    function addMessage({bot, text, citation, status, provider, actions = []}) {
      const item = document.createElement('article'); item.className = 'message ' + (bot ? 'bot' : 'user');
      const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = bot ? 'TL' : 'HV'; item.append(avatar);
      const bubble = document.createElement('div'); bubble.className = 'bubble';
      const head = document.createElement('div'); head.className = 'head'; head.innerHTML = '<span class="name">' + (bot ? 'Trợ lý K4' : 'hocvien_k4') + '</span><span class="time">' + time() + '</span>'; bubble.append(head);
      const content = document.createElement('div'); content.className = 'content'; content.textContent = escape(text); bubble.append(content);
      if (bot && provider) { const trace = document.createElement('small'); trace.style.cssText = 'display:block;margin-top:5px;color:#8e97aa;font-size:11px'; trace.textContent = provider === 'gemini' ? '✦ Intent do Gemini Flash phân loại · dữ kiện đã grounding cục bộ' : '⌁ Intent do rule an toàn cục bộ phân loại'; bubble.append(trace); }
      if (citation) {
        const source = document.createElement('div'); source.className = 'source';
        const quote = document.createElement('div'); quote.textContent = (citation.verified ? '📌 ' : '🧪 ') + citation.quote; source.append(quote);
        const detail = document.createElement('small'); detail.textContent = citation.channel + ' · ' + citation.message_id;
        if (citation.url) { detail.append(document.createTextNode(' · ')); const link = document.createElement('a'); link.href = citation.url; link.target = '_blank'; link.rel = 'noreferrer'; link.textContent = 'Mở nguồn'; detail.append(link); }
        else { detail.append(document.createTextNode(' · Fixture demo chưa xác minh')); }
        source.append(detail); bubble.append(source);
      } else if (status === 'ta_handoff' || status === 'rejected') {
        const notice = document.createElement('div'); notice.className = 'notice'; notice.textContent = status === 'rejected' ? 'Giới hạn quyền truy cập · HAX G11' : 'Không có căn cứ chính thức · Chuyển TA'; bubble.append(notice);
      }
      if (actions.length) {
        const group = document.createElement('div'); group.className = 'actions';
        actions.forEach(option => { const button = document.createElement('button'); button.textContent = option.label; button.className = option.action === 'trigger_ta_handoff' ? 'handoff' : option.action === 'show_ticket_help' ? 'ticket' : ''; button.onclick = () => handleAction(option); group.append(button); }); bubble.append(group);
      }
      item.append(bubble); chat.append(item); chat.scrollTop = chat.scrollHeight;
    }
    function handleAction(option) {
      if (option.action === 'trigger_ta_handoff') toastMessage('Đã tạo thread hỗ trợ và gắn thẻ @TA.');
      else if (option.action === 'show_ticket_help') toastMessage('Dùng /ticket create tại kênh #ticket-support.');
      else if (option.value) send(option.value);
    }
    function render(result) {
      const options = result.interactive_elements?.options || [];
      addMessage({ bot:true, text:result.reply_text, citation:result.source_citation, status:result.status, provider:result.processing_metadata?.intent_provider, actions:options });
    }
    async function send(text) {
      const question = String(text || '').trim(); if (!question) return;
      addMessage({bot:false, text:question}); input.value = ''; typing.classList.add('show');
      try {
        const response = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user_id:'2A202602703', channel_id:'hoi-dap-lab', message_text:question, timestamp:new Date().toISOString()})});
        if (!response.ok) throw new Error('API trả về ' + response.status);
        render(await response.json());
      } catch (error) {
        addMessage({bot:true, text:'Không thể kết nối Core AI. Hãy chạy Python server rồi thử lại.', status:'error'});
        toastMessage(error.message);
      } finally { typing.classList.remove('show'); input.focus(); }
    }
    document.querySelector('#composer').addEventListener('submit', event => { event.preventDefault(); send(input.value); });
    document.querySelectorAll('[data-q]').forEach(button => button.onclick = () => send(button.dataset.q));
    addMessage({bot:true, text:'Chào bạn! Mình chỉ trả lời về hạn nộp và thủ tục K4 từ thông báo chính thức. Khi chưa có nguồn, mình sẽ chuyển TA thay vì đoán.'});
  </script>
</body>
</html>
